apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-ai-lab
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: cloudframe-platform
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.37.0
    helm:
      values: |
        controlPlane:
          distro:
            k8s:
              enabled: true
          statefulSet:
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
        sync:
          toHost:
            ingresses:
              enabled: true
          # Deliberadamente SIN fromHost.secrets: este vCluster es un lab aislado
          # (ADR 0001/0002 en lab06-ai-orchestration) y no debe recibir secrets de
          # la plataforma (Keycloak, Vault, etc). GitOps interno propio, no gestionado
          # desde este ArgoCD (host) más allá de crear el vCluster en sí.
  destination:
    server: https://kubernetes.default.svc
    namespace: vcluster-ai-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
