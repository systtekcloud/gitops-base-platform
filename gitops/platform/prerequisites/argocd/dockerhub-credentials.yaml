apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-dockerhub-credentials
  namespace: argo
spec:
  type: kv-v2
  mount: secret
  path: platform/argocd/dockerhub
  destination:
    name: repo-dockerhub-cloudpirates-etcd
    create: true
    labels:
      argocd.argoproj.io/secret-type: repository
    transformation:
      templates:
        type:
          text: 'helm'
        name:
          text: 'cloudpirates-etcd'
        url:
          text: 'registry-1.docker.io/cloudpirates/etcd'
        enableOCI:
          text: 'true'
        username:
          text: '{{ .Secrets.username }}'
        password:
          text: '{{ .Secrets.password }}'
  refreshAfter: 1h
  vaultAuthRef: argocd-vault-auth
