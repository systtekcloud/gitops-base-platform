apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: httpbin-vault-auth
  namespace: httpbin
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: httpbin-vso
    serviceAccount: default
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: httpbin-gitlab-credentials
  namespace: httpbin
spec:
  type: kv-v2
  mount: secret
  path: platform/kargo/gitlab
  destination:
    name: kargo-gitlab-credentials
    create: true
    labels:
      kargo.akuity.io/cred-type: git
    transformation:
      templates:
        repoURL:
          text: 'https://gitlab.com/eks-vcluster-platform/gitops-base-platform.git'
        username:
          text: '{{ .Secrets.username }}'
        password:
          text: '{{ .Secrets.password }}'
  refreshAfter: 1h
  vaultAuthRef: httpbin-vault-auth
