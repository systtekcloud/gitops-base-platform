# Secrets para la instancia CNPG de Postgres de Keycloak (EN PARALELO, sin cutover).
# No sustituye a keycloak-db-secret / keycloak-postgresql (el STS manual sigue siendo
# el que usa el Keycloak en producción del lab). Ver memoria del proyecto:
# "PENDIENTE: migrar keycloak-postgres a CNPG" — la migración de datos (dump/restore)
# se planifica y ejecuta aparte, una vez esta instancia esté sana.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: keycloak-cnpg-vault-auth
  namespace: keycloak
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: keycloak-cnpg-vso
    serviceAccount: default
---
# Secret basic-auth (username/password) para el owner de la DB en el Cluster CNPG.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-cnpg-pg-app-sync
  namespace: keycloak
spec:
  type: kv-v2
  mount: secret
  path: platform/keycloak-cnpg/dev
  destination:
    name: keycloak-cnpg-pg-app
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    transformation:
      templates:
        username:
          text: 'keycloak'
        password:
          text: '{{ .Secrets.db_password }}'
  refreshAfter: 60s
  vaultAuthRef: keycloak-cnpg-vault-auth
