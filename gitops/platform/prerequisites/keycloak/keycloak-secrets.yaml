apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: keycloak-vault-auth
  namespace: keycloak
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: keycloak
    serviceAccount: default
---
# keycloak-db-secret-sync eliminado (2026-09-09): Keycloak usa ahora
# keycloak-cnpg-pg-app (cutover a CloudNativePG). Ya no hay STS manual que
# consuma este secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-admin-secret-sync
  namespace: keycloak
spec:
  type: kv-v2
  mount: secret
  path: platform/keycloak/dev
  destination:
    name: keycloak-admin-secret
    create: true
    transformation:
      templates:
        admin-password:
          text: '{{ .Secrets.admin_password }}'
  refreshAfter: 60s
  vaultAuthRef: keycloak-vault-auth
