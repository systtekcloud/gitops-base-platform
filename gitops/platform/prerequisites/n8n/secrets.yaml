apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: n8n-vault-auth
  namespace: n8n
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: n8n-vso
    serviceAccount: default
---
# Secret para el owner del Cluster CNPG (tipo basic-auth: username + password).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: n8n-pg-app-sync
  namespace: n8n
spec:
  type: kv-v2
  mount: secret
  path: platform/n8n/dev
  destination:
    name: n8n-pg-app
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    transformation:
      templates:
        username:
          text: 'n8n'
        password:
          text: '{{ .Secrets.db_password }}'
  refreshAfter: 60s
  vaultAuthRef: n8n-vault-auth
---
# Secret para el chart n8n: postgres-password (que espera externalPostgresql.existingSecret)
# y N8N_ENCRYPTION_KEY (que espera existingEncryptionKeySecret).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: n8n-app-sync
  namespace: n8n
spec:
  type: kv-v2
  mount: secret
  path: platform/n8n/dev
  destination:
    name: n8n-app
    create: true
    transformation:
      templates:
        postgres-password:
          text: '{{ .Secrets.db_password }}'
        N8N_ENCRYPTION_KEY:
          text: '{{ .Secrets.encryption_key }}'
  refreshAfter: 60s
  vaultAuthRef: n8n-vault-auth
