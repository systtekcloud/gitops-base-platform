apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-local-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: lab-local-root-ca
  secretName: lab-local-root-ca-secret
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-local-ca
spec:
  ca:
    secretName: lab-local-root-ca-secret
