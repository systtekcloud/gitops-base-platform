apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-pg
  namespace: n8n
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      # Secret basic-auth (username/password) sincronizado por VSO desde Vault.
      secret:
        name: n8n-pg-app
  # Recursos contenidos para el lab en kind.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
