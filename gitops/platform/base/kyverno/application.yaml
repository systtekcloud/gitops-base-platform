apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cloudframe-platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # 3.8.x (Kyverno v1.18) soporta k8s v1.33-v1.35. La 3.7.1 (v1.17.1) usa el
    # cliente v1alpha1 de MutatingAdmissionPolicy, retirado en k8s 1.35 -> el
    # admission-controller crasheaba en cache sync (CrashLoop, sin cert TLS).
    targetRevision: 3.8.2
    helm:
      values: |
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
