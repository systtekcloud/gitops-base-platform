apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kargo-vault-auth
  namespace: kargo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kargo-vso
    serviceAccount: default
    tokenExpirationSeconds: 600
